<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b2f22"><link rel="manifest" href="manifest.json"><title>SchoolTrack</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><div class="brand">📋 SchoolTrack</div><div class="sub">Offline School Inventory</div></div><button id="themeBtn" class="iconBtn" title="Toggle theme">🌙</button></header>
<main>
<section id="dashboard" class="page active"><h1>Dashboard</h1><div class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="available">0</b><span>Available</span></div><div><b id="borrowed">0</b><span>Borrowed</span></div><div><b id="repair">0</b><span>Repair</span></div><div><b id="missing">0</b><span>Missing</span></div></div><div class="stockBox"><strong id="stockText">In stocks</strong><span>Stock status updates automatically.</span></div><div class="quick"><button data-go="inventory">📦 Inventory</button><button data-go="add">➕ Add Item</button><button data-go="reports">📝 Reports</button><button data-go="history">🕘 History</button></div></section>
<section id="inventory" class="page"><div class="pageHead"><h1>Inventory</h1><button data-go="add" class="primary">＋ Add Item</button></div><input id="search" class="search" placeholder="🔎 Search item..."><div id="inventoryList"></div></section>
<section id="add" class="page"><h1 id="formTitle">➕ Add Item</h1><form id="itemForm">
<label>Item ID<input id="itemId" required placeholder="e.g. ICT-001"></label>
<label>Item Name<select id="itemName" required><option value="">Choose item</option><option>Desktop Computer</option><option>Laptop</option><option>Keyboard</option><option>Mouse</option><option>Monitor</option><option>Printer</option><option>Projector</option><option>TV</option><option>Electric Fan</option><option>Chair</option><option>Table</option><option>Other</option></select></label>
<label>Category<select id="category" required><option value="">Choose category</option><option>Computer</option><option>Peripheral</option><option>Electrical</option><option>Furniture</option><option>Multimedia</option><option>Office Supply</option><option>Other</option></select></label>
<label>Quantity<input id="quantity" type="number" min="1" value="1" required></label>
<label>Quality<select id="quality" required><option>New</option><option>Good</option><option>Fair</option><option>Poor</option></select></label>
<label>Condition<select id="condition" required><option>Working</option><option>Needs Repair</option><option>Damaged</option></select></label>
<label>Location<select id="location" required><option>ICT Laboratory</option><option>Computer Room</option><option>Faculty Room</option><option>Office</option><option>Library</option><option>Storage Room</option><option>Classroom</option><option>Other</option></select></label>
<label>Person Responsible<select id="responsible" required><option>ICT Coordinator</option><option>Property Custodian</option><option>School Administrator</option><option>Teacher</option><option>ICT Staff</option><option>Other</option></select></label>
<label>Remarks<textarea id="remarks" placeholder="Optional notes"></textarea></label><button class="save" type="submit">💾 Save Item</button><button class="secondary" type="button" data-go="inventory">Cancel</button></form></section>
<section id="reports" class="page"><div class="pageHead"><h1>Problem Reports</h1><button id="newReport" class="primary">＋ Report</button></div><div id="reportsList"></div></section>
<section id="history" class="page"><h1>History & Backup</h1><div class="panel"><button id="backup">⬇️ Backup</button><label class="fileBtn">⬆️ Restore<input id="restore" type="file" accept="application/json" hidden></label><button id="csv">📄 Export CSV</button><button id="clear" class="danger">🗑 Clear Data</button></div><div id="historyList"></div></section>
</main><nav><button data-go="dashboard">🏠<span>Home</span></button><button data-go="inventory">📦<span>Inventory</span></button><button data-go="add">➕<span>Add</span></button><button data-go="reports">📝<span>Reports</span></button><button data-go="history">🕘<span>History</span></button></nav><script src="app.js"></script></body></html>
